# =============================================================================
# Obsidian 知识库自动化搭建工具 —— 配置文件
# 支持 YAML 与 JSON 两种格式；本文件为完整默认配置，删掉任何键都会用内置默认值。
# 修改后无需改程序，下次运行自动生效。
# =============================================================================

# ---- 库基本信息 -------------------------------------------------------------
vault:
  name: "我的知识库"          # 库名（root 为空时，建在 <当前目录>/<name>）
  root: ""                    # 库根绝对路径；留空则使用上方 name

# ---- 目录结构：键为逻辑名，值为相对路径（建库时按顺序创建）--------------------
# 兵哥四层架构：未处理/已处理 → B 知识提炼 → C 知识聚合 → D 规则模板
structure:
  未处理: "未处理"                    # 批量导入与豆包提炼的统一源目录，把要整理的资料丢进来
  已处理: "已处理"                    # 导入/提炼完成后，源文件移入此处归档
  B_知识提炼: "知识提炼"               # 程序生成的标准化笔记都在这里
  C_知识聚合: "知识聚合"               # 你的创作空间，程序不写不删
  C_MOC: "知识聚合/MOC"               # 自动生成的标签/分类索引页
  D_规则模板: "规则模板"               # 提示词与格式规范，可自行修改
  附件: "附件"                        # PDF、图片等原始文件归档
  日记: "日记"

# ---- 导入设置 -----------------------------------------------------------------
import:
  inbox: "未处理"              # 导入源：库内相对路径，或任意绝对路径
  extra_sources: []           # 额外扫描源（默认无；未处理已统一收口）
  include_exts: [".md", ".txt", ".pdf", ".docx", ".png", ".jpg", ".jpeg", ".gif", ".webp"]
  attachment_exts: [".png", ".jpg", ".jpeg", ".gif", ".webp"]   # 直接归档的类型
  archive_exts: [".pdf", ".docx", ".xlsx", ".pptx"]             # 提取失败时归档
  pdf_mode: "extract"         # extract=提取正文生成笔记 | archive=仅归档
  pdf_max_pages: 50
  move_after_import: true     # 导入后源文件移入「已处理」或「附件」
  dedupe_by_hash: true        # 幂等：按内容 SHA-256 去重，重复运行不重复导入
  keep_subdirs: false         # 是否保留导入源的子目录层级
  max_depth: 5

# ---- frontmatter 规范 ----------------------------------------------------------
frontmatter:
  fields: [title, tags, created, updated, source, category, status]
  status_new: "待整理"        # 新导入笔记的状态
  status_done: "已整理"
  date_format: "%Y-%m-%d %H:%M"

# ---- 自动打标规则 ----------------------------------------------------------------
tags:
  # 关键词 → 标签：命中文件名或正文即自动打标。以下为示例，请按需增删。
  rules:
    - tag: "轨道交通"
      keywords: ["轨道", "铁路", "高铁", "地铁", "城轨", "机车", "车辆", "牵引", "信号"]
    - tag: "电力电子"
      keywords: ["变流", "逆变", "整流", "IGBT", "igbt", "辅助供电", "牵引变流器"]
    - tag: "知识管理"
      keywords: ["知识库", "笔记法", "卡片盒", "Zettelkasten", "zettelkasten",
                 "双链", "双向链接", "Obsidian", "obsidian", "第二大脑"]
    - tag: "AI工具"
      keywords: ["AI", "ai", "大模型", "豆包", "提示词", "GPT", "gpt", "智能体", "Agent", "agent"]
    - tag: "标准规范"
      keywords: ["标准", "规范", "国标", "EN ", "IEC", "iec", "ISO", "iso", "认证"]
  extract_hashtags: true      # 从正文提取 #标签
  max_tags: 10                # 单篇笔记标签数上限

# ---- 双链关联引擎（按兵哥规则模板：关键词是链接的唯一依据） ---------------------
linking:
  strategy: "keywords"        # keywords=关键词匹配（模板）| title_tags=标题+标签 | none
  min_keywords: 3             # 共享 ≥3 个相同关键词即建链（模板阈值）
  max_links_per_note: 8       # 每篇笔记最多保留前 8 条强相关链接（模板）
  link_to_source: true        # 新笔记自动链接其自身原始素材（已处理/）
  gen_moc: true               # 为每个标签/分类生成 MOC 索引页
  include_c: false            # 是否把 C 层创作笔记纳入匹配（程序仍只读 C 层）
  links_section: "相关笔记"    # 笔记尾部自动维护的关联区块标题

# ---- 命名规范 ---------------------------------------------------------------------
naming:
  date_prefix: true           # 笔记名加日期前缀：2026-08-14_xxx.md
  date_prefix_format: "%Y-%m-%d"
  sanitize: true              # 清理文件名非法字符
  space_replacement: "_"      # 空格替换符
  max_len: 80                 # 文件名最长字符数

# ---- 定时模式 --------------------------------------------------------------------
scheduler:
  interval_minutes: 30        # watch 内置循环轮询间隔（分钟）
  task_name: "ObsidianKB-Sync" # Windows 计划任务名称
  task_time: "09:00"           # 计划任务默认执行时间

# ---- 日志与报告 ------------------------------------------------------------------
logging:
  log_dir: "处理日志"
  report_file: "处理报告"       # 每次运行生成 处理报告_时间戳.md + 最新 处理报告.md
